<!doctype html>
<html lang="en">
  <head>
    <!--Bootstrap-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!--CSS-->
    <link rel="stylesheet" href="css/style.css" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback</title>
  </head>
  <body>
    <header class="hero">
      <h1>Feedback!</h1>
    </header>

    <section class="intro">
      <p>
        Thank you for taking the time to read what I wanted to say! If you have
        any recommendations or comments please feel free to send me something, I
        enjoy seeing the feedback.
      </p>
    </section>
    <main class="layout">
      <aside class="sidebar">
        <a href="./index.html">Home</a>
        <a href="./games.html">My Games</a>
        <img
          src="image/download.jpg"
          alt="Playstation Logo"
          class="playstation-image"
        />
      </aside>

      <section class="feedback-section">
        <form class="feedback-form">
          <div class="form-row">
            <div class="form-group">
              <label for="first-name">First Name</label>
              <input type="text" id="first-name" name="first-name" />
            </div>

            <div class="form-group">
              <label for="last-name">Last Name</label>
              <input type="text" id="last-name" name="last-name" />
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" />
            </div>
          </div>

          <div class="form-group">
            <label for="feedback">Your Feedback</label>
            <textarea id="feedback" name="feedback" rows="6"></textarea>
          </div>

          <button type="submit">Submit Feedback</button>
        </form>
      </section>
    </main>
  </body>
</html>
